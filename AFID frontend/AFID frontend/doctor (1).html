    }

    async function addDiagnosticRow() {
      const testSelect = document.getElementById('diagnostic-test-select');
      const urgencySelect = document.getElementById('diagnostic-urgency-select');

      if (!testSelect.value) {
        await uiAlert("Please select a diagnostic investigation from the list first.", { title: 'Diagnostics' });
        return;
      }

      if (testSelect.value === "Advise new treatment file" || testSelect.value === "Advise new treatment") {
        handleDiagnosticSelectChange(testSelect);
        return;
      }

      // Re-requesting the same test updates its urgency instead of queueing a
      // duplicate order for the same investigation.
      const existing = activeDiagnostics.find(d => d.name.toLowerCase() === testSelect.value.toLowerCase());
      if (existing) {
        existing.urgency = urgencySelect.value;
        showDoctorToast(`Updated ${existing.name} urgency to ${urgencySelect.value}`);
      } else {
        activeDiagnostics.push({ name: testSelect.value, urgency: urgencySelect.value });
      }
      activeDiagnostics.sort(sortByProp('name'));

      testSelect.value = '';
      renderDiagnosticsList();
    }

    function removeDiagnosticRow(idx) {
      const removedItem = activeDiagnostics[idx];
      activeDiagnostics.splice(idx, 1);

      if (removedItem && removedItem.name === "Advise new treatment file") {
        activeDiagnostics = activeDiagnostics.filter(item => 
          !ADVANCED_TREATMENT_ITEMS.some(adv => adv.toLowerCase() === item.name.toLowerCase())
        );
      }

      renderDiagnosticsList();
    }

    /* ===================== SUMMARY CONTROLLER ===================== */
    function compileMasterSummary() {
      if (!currentPatient) return;

      const procedureTitle = document.getElementById('procedure-select').value || "Routine Clinical Assessment";
      const notesValue = document.getElementById('clinical-notes-textarea').value || "No detailed observation metrics added.";
      const timeIn = document.getElementById('patient-time-in').value;
      const timeOut = document.getElementById('patient-time-out').value;
      const duration = (currentPatient.check_in_time && currentPatient.check_out_time)
        ? `${Math.max(0, Math.round((new Date(currentPatient.check_out_time) - new Date(currentPatient.check_in_time)) / 60000))} min`
        : '—';

      const materialsHtml = activeMaterials.map(m => `<div>• ${m.name} <span class="qty-val">QTY: ${m.qty}</span></div>`).join('') || "No clinical components allocated.";
      const pharmacyRows = activePharmacy.map(p => `<tr><td>${p.med}</td><td>${p.dose}</td><td>${p.freq}</td></tr>`).join('') || '<tr><td colspan="3">None ordered.</td></tr>';
      const diagnosticsRows = activeDiagnostics.map(d => `<tr><td>${d.name}</td><td>${d.urgency}</td></tr>`).join('') || '<tr><td colspan="2">No systemic diagnostic runs flagged.</td></tr>';

      const targetReportBox = document.getElementById('master-summary-injection-point');
      targetReportBox.innerHTML = `
        <div class="summary-sheet">
          <!-- These carry the institute header, the patient identifiers and the
               materials log. They were marked .print-hide, which the @media
               print rule hides outright -- so the printed discharge order came
               out with no letterhead, no patient details and no materials. -->
          <div class="summary-header">
            <h2>ARMED FORCES INSTITUTE OF DENTISTRY</h2>
            <p style="font-size:12px; font-weight:600; text-transform:uppercase; color:var(--text-muted); margin-top:4px;">Official Compiled Patient Treatment & Discharge Order</p>
          </div>

          <div class="summary-grid">
            <div>
              <p><strong>Patient Name:</strong> ${currentPatient.full_name}</p>
              <p><strong>MR Number:</strong> ${currentPatient.mr_number}</p>
              <p><strong>File Number:</strong> ${currentPatient.file_number || '—'}</p>
              <!-- Never substitute a guessed classification: an unset service
                   profile prints as "Not recorded", not as an invented
                   "Civ / Dependent" that goes onto an official discharge order. -->
              <p><strong>Rank / Service Profile:</strong> ${currentPatient.service_profile || currentPatient.rank || 'Not recorded'}</p>
              <p><strong>Gender / Blood Group:</strong> ${currentPatient.gender || '—'} / ${currentPatient.blood_group || '—'}</p>
            </div>
            <div style="text-align:right;">
              <p><strong>Session Timeline:</strong> ${timeIn} - ${timeOut}</p>
              <p><strong>Duration:</strong> ${duration}</p>
              <p><strong>Allergy Profile:</strong> <span style="color:var(--red); font-weight:700;">${currentPatient.allergies || 'NKA'}</span></p>
              <!-- The doctor actually signed in, not the hard-coded demo name
                   this template shipped with. -->
              <p><strong>Attending Specialist:</strong> ${currentDoctorName() || 'Unknown'}</p>
              <p><strong>Report Generated:</strong> ${new Date().toLocaleString()}</p>
            </div>
          </div>

          <div class="summary-field">
            <label>Target Clinical Operation performed</label>
            <div><strong>${procedureTitle}</strong></div>
          </div>

          <div class="summary-field">
            <label>Materials Used Log</label>
            <div>${materialsHtml}</div>
          </div>

          <div class="summary-field">
            <label>Prescribed Pharmacy Logs</label>
            <div style="background:#fff; padding:0;">
              <table style="width:100%;">
                <thead><tr><th>Medication</th><th>Dose</th><th>Frequency</th></tr></thead>
                <tbody>${pharmacyRows}</tbody>
              </table>
            </div>
          </div>

          <div class="summary-field">
            <label>Diagnostics Actions Ordered</label>
            <div style="background:#fff; padding:0;">
              <table style="width:100%;">
                <thead><tr><th>Diagnostic Screening Target</th><th>Urgency Threshold</th></tr></thead>
                <tbody>${diagnosticsRows}</tbody>
              </table>
            </div>
          </div>

          <div class="summary-field">
            <label>Specialist Progress Summary & Care Directives</label>
            <div>${notesValue}</div>
          </div>

          <div style="text-align:center; margin-top:30px;" class="print-action-row">
            <button class="btn btn-danger" style="background:var(--green-dark);" onclick="window.print()">🖨️ Dispatch & Print Structural Record</button>
          </div>
        </div>
      `;

      targetReportBox.scrollIntoView({ behavior: 'smooth' });
    }

    let cachedTimelineSteps = {};

    // Refreshes the patient cache the timeline view filters against. It used to
    // fetch /patients/ and throw the response away, then call
    // renderPatientTimeline() purely for its (discarded) return value.
    async function loadTimelineData() {
      try {
        const patients = await api.get('/patients/');
        if (patients) cachedPatients = patients;
      } catch (e) {
        console.warn('Timeline load failed:', e);
      }
    }

    async function fetchTimelineSteps(mr) {
      try {
        const steps = await api.get(`/hod/timeline/${encodeURIComponent(mr)}`);
        cachedTimelineSteps[mr] = steps || [];
      } catch (e) {
        cachedTimelineSteps[mr] = [];
      }
    }

    async function timelineSearch() {
      const tbody = document.getElementById('timeline-results-body');
      const detailArea = document.getElementById('timeline-detail-area');
      if (!tbody) return;

      const filterType = document.getElementById('timeline-filter-type')?.value || 'mr_number';
      const query = document.getElementById('timeline-search-input')?.value.trim().toLowerCase() || '';

      if (!query) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#6b7280;">Enter a search term.</td></tr>';
        if (detailArea) detailArea.style.display = 'none';
        return;
      }

      // Re-read patients before filtering. This searched a cache captured at
      // page load, so a patient whose case had since been completed still
      // showed the status they had when the portal was first opened -- most
      // visibly, a checked-out patient still listed as WAITING.
      try {
        const fresh = await api.get('/patients/');
        if (fresh) cachedPatients = fresh;
      } catch (e) {
        console.warn('Failed to refresh patient data for timeline search:', e);
      }

      const mine = myPatients();

      // Map the dropdown value to the actual field name on the patient record.
      // "name" was passed straight through as a property key, but the API
      // returns full_name -- so searching by name always matched nothing.
      const FIELD_MAP = { mr_number: 'mr_number', file_number: 'file_number', name: 'full_name' };
      const field = FIELD_MAP[filterType] || 'mr_number';

      let results = mine.filter(p => p && (p[field] || '').toString().toLowerCase().includes(query));

      // Widen to any identifying field rather than giving up.
      if (!results.length) {
        results = mine.filter(p => p && ['mr_number', 'file_number', 'full_name', 'cnic', 'rank']
          .some(f => (p[f] || '').toString().toLowerCase().includes(query)));
      }

      tbody.innerHTML = results.length ? results.map(p => `
        <tr style="cursor:pointer;" onclick="selectTimelinePatient('${p.mr_number}')">
          <td><strong>${p.mr_number}</strong></td>
          <td>${p.file_number || '—'}</td>
          <td>${p.full_name}</td>
          <td><span class="badge ${(p.status || '').toString().toUpperCase() === 'ACTIVE' ? 'badge-success' : (p.status || '').toString().toUpperCase() === 'COMPLETED' ? 'badge-info' : 'badge-warning'}">${(p.status || '—').toString().toUpperCase()}</span></td>
          <td><button class="btn btn-sm" onclick="event.stopPropagation(); selectTimelinePatient('${p.mr_number}')" style="height:38px;">View Timeline</button></td>
        </tr>
      `).join('') : `<tr><td colspan="5" style="text-align:center; color:#6b7280;">
          No patient assigned to ${currentDoctorName() || 'you'} matches “${query}”.
        </td></tr>`;
    }

    async function selectTimelinePatient(mr) {
      const detailArea = document.getElementById('timeline-detail-area');
      const titleEl = document.getElementById('timeline-patient-title');
      const badgeEl = document.getElementById('timeline-total-badge');
      const stepsList = document.getElementById('timeline-steps-list');
      const record = (cachedPatients || []).find(p => p.mr_number === mr) || null;
      if (detailArea) detailArea.style.display = 'block';
      // Show the patient's real name and their CURRENT case status alongside
      // the MR number, instead of the bare MR string.
      if (titleEl) {
        titleEl.innerText = record ? `${record.full_name} (${mr})` : mr;
        const subtitle = titleEl.parentElement?.querySelector('p');
        if (subtitle && record) {
          subtitle.innerText = `Case status: ${(record.status || 'WAITING').toString().toUpperCase()} · Procedure breakdown by status`;
        }
      }

      try {
        const steps = await api.get(`/hod/timeline/${encodeURIComponent(mr)}`);
        cachedTimelineSteps[mr] = steps || [];
      } catch (e) {
        cachedTimelineSteps[mr] = [];
      }

      const allSteps = cachedTimelineSteps[mr] || [];
      const completedProcedures = allSteps.filter(s => (s.status || '').toLowerCase() === 'completed');
      const pending = allSteps.filter(s => (s.status || '').toLowerCase() === 'pending');
      const inProgress = allSteps.filter(s => (s.status || '').toLowerCase() === 'in progress');
      if (badgeEl) badgeEl.innerText = `Total Performed: ${completedProcedures.length}`;

      const buildList = (items, emptyLabel, badgeClass, icon) => items.length ? items.map(s => `
        <div class="check-item">
          <div class="check-circle ${badgeClass}">${icon || ''}</div>
          <div class="check-text">
            <div style="font-size:15px; font-weight:700; color:#1f2937;">${s.name || s.step_name || '—'}</div>
          </div>
          <div class="check-status-badge cs-${badgeClass}">${s.status || '—'}</div>
        </div>
      `).join('') : `<div style="text-align:center; padding:16px; color:#6b7280; font-size:13px;">${emptyLabel}</div>`;

      if (stepsList) stepsList.innerHTML = `
        ${buildList(pending, 'No pending steps.', 'pending', '○')}
        ${buildList(inProgress, 'No in-progress steps.', 'active', '◐')}
        ${buildList(completedProcedures, 'No completed procedures yet.', 'completed', '✓')}
      `;
    }

    function renderPatientTimeline() {
      return `
        <div class="container-card">
          <div class="container-title"><span>Patient Procedure Timeline</span></div>
          <div class="panel-body">
            <div class="flex-row-inputs" style="margin-bottom:0;">
              <div style="flex: 1;">
                <select id="timeline-filter-type">
                  <option value="mr_number">MR Number</option>
                  <option value="file_number">File Number</option>
                  <option value="name">Name</option>
                </select>
              </div>
              <div style="flex: 2;">
                <input type="text" id="timeline-search-input" placeholder="Search patient..." onkeydown="if(event.key==='Enter') timelineSearch()" />
              </div>
              <div class="btn-holder">
                <button class="btn" onclick="timelineSearch()" style="height:45px;">Search</button>
              </div>
            </div>
            <div class="inner-card" style="margin-top:16px;">
              <table>
                <thead><tr><th>MR Number</th><th>File Number</th><th>Name</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="timeline-results-body">
                  <tr><td colspan="5" style="text-align:center; color:#6b7280;">Use the search above to find a patient.</td></tr>
                </tbody>
              </table>
            </div>
            <div id="timeline-detail-area" style="margin-top:24px; display:none;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid var(--border); padding-bottom:12px;">
                <div>
                  <h2 style="font-size:18px; font-weight:800; color:var(--green-dark);" id="timeline-patient-title">Patient</h2>
                  <p style="font-size:12px; color:var(--text-muted); margin-top:2px;">Procedure breakdown by status</p>
                </div>
                <span style="font-size:12px; font-weight:700; background:var(--green-light); padding:6px 12px; border-radius:6px; color:var(--green-dark);" id="timeline-total-badge">Total Performed: 0</span>
              </div>
              <div class="checklist-v" id="timeline-steps-list"></div>
            </div>
          </div>
        </div>
      `;
    }

    /* ===================== SYSTEM APP ROUTER ===================== */
    async function switchView(pageId) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeBtn = document.querySelector(`[data-page="${pageId}"]`);
      if (activeBtn) activeBtn.classList.add('active');

      const mainRoot = document.getElementById('main-root');
      if (pageId === 'dashboard') {
        mainRoot.innerHTML = renderDashboard();
        // Pull the live queue in the background so patients registered by
        // reception since this portal loaded appear without a manual refresh.
        loadTimelineData().then(() => {
          if (document.querySelector('.nav-item.active')?.dataset.page === 'dashboard') {
            mainRoot.innerHTML = renderDashboard();
          }
        });
      } else if (pageId === 'operations') {
        mainRoot.innerHTML = renderOperations();
      } else if (pageId === 'timeline') {
        mainRoot.innerHTML = renderPatientTimeline();
        loadTimelineData();
      } else if (pageId === 'doctor-analytics') {
        mainRoot.innerHTML = renderDoctorAnalytics();
        processAndRenderDoctorAnalytics();
      } else if (pageId === 'leave') {
        mainRoot.innerHTML = renderLeave();
        // Re-read leave state on entry so HOD approvals/rejections made since
        // login are reflected instead of a stale snapshot. Only the log TABLE
        // is repainted, never the whole view -- a full re-render landing while
        // the doctor is filling in the request form below would wipe out
        // whatever they had already typed.
        refreshMyLeaves().then(() => {
          if (document.querySelector('.nav-item.active')?.dataset.page === 'leave') {
            repaintLeaveLog();
          }
        });
      }
    }

    function handleLogout() {
      if (typeof window.logout === 'function') {
        window.logout();
      } else if (typeof logout === 'function') {
        logout();
      } else {
        window.location.replace('Login.html');
      }
    }

    async function confirmTimeOut() {
      if (!currentPatient) {
        await uiAlert("No active patient selected. Search for a patient record first.", { title: 'No Patient', tone: 'warn' });
        return;
      }

      const procedureSelect = document.getElementById('procedure-select');
      const procedureTitle = procedureSelect.value;
      if (!procedureTitle) {
        await uiAlert("Select the procedure that was performed before completing the session.", { title: 'Procedure Required', tone: 'warn' });
        return;
      }

      const timeOutInput = document.getElementById('patient-time-out');
      const timeOut = timeOutInput.value || '—';

      const proceed = await uiConfirm(
        `Complete the session for ${currentPatient.full_name} (${currentPatient.mr_number})?\n\n`
        + `Procedure: ${procedureTitle}\n`
        + `Materials: ${activeMaterials.length}   Medications: ${activePharmacy.length}   Diagnostics: ${activeDiagnostics.length}\n`
        + `Time Out: ${timeOut}`,
        { title: 'Complete Session', confirmLabel: 'Save & Complete' }
      );
      if (!proceed) return;

      const notesValue = document.getElementById('clinical-notes-textarea').value;

      try {
        // 1. Save procedure session. doctor_id is omitted so the backend
        //    attributes it to the signed-in doctor -- it used to send null,
        //    which saved every procedure with no doctor attached at all.
        const proc = await api.post('/procedures/', {
          patient_id: currentPatient.id,
          name: procedureTitle,
          is_completed: true
        });

        // 2. Save materials, pharmacy, diagnostics and notes. Collect failures
        //    instead of aborting: a single rejected row must not leave the rest
        //    of the session silently unsaved.
        const failures = [];

        for (const m of activeMaterials) {
          try {
            await api.post(`/procedures/${proc.id}/materials`, {
              material_name: m.name,
              quantity: m.qty || 1
            });
          } catch (e) { failures.push(`Material “${m.name}”: ${e.message}`); }
        }

        for (const p of activePharmacy) {
          try {
            await api.post(`/procedures/${proc.id}/pharmacy`, {
              medication: p.med,
              // The UI writes '—' as a visual placeholder for "not specified";
              // don't persist that glyph as if it were a real dose/frequency.
              dose: p.dose === '—' ? null : p.dose,
              frequency: p.freq === '—' ? null : p.freq
            });
          } catch (e) { failures.push(`Medication “${p.med}”: ${e.message}`); }
        }

        for (const d of activeDiagnostics) {
          try {
            await api.post(`/procedures/${proc.id}/diagnostics`, {
              test_name: d.name,
              urgency: d.urgency || 'Routine'
            });
          } catch (e) { failures.push(`Diagnostic “${d.name}”: ${e.message}`); }
        }

        if (notesValue && notesValue.trim()) {
          try {
            await api.post(`/procedures/${proc.id}/notes`, { note_text: notesValue });
          } catch (e) { failures.push(`Clinical notes: ${e.message}`); }
        }

        // 3. Record the procedure on the patient's timeline so it shows up in
        //    the HOD's "Completed Procedures Log" and in Patient Timeline.
        //    Nothing wrote timeline steps before, which is why a patient could
        //    be checked out with a full summary and still show an empty
        //    timeline stuck on WAITING.
        try {
          await api.post(`/hod/timeline/${encodeURIComponent(currentPatient.mr_number)}/steps`, {
            step_name: procedureTitle,
            status: 'Completed'
          });
        } catch (e) {
          failures.push(`Timeline entry: ${e.message}`);
        }

        // 4. Mark patient as completed (backend stamps check_out_time).
        const updated = await api.patch(`/patients/${currentPatient.id}/status`, { status: 'COMPLETED' });
        currentPatient = updated;
        const updatedTimeOut = updated.check_out_time ? new Date(updated.check_out_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
        timeOutInput.value = updatedTimeOut;

        const statusCells = document.querySelectorAll('#view-workspace-screen .value');
        if (statusCells[5]) statusCells[5].innerHTML = '<span style="color:#0369a1; font-weight:800;">COMPLETED</span>';

        const cachedIdx = (cachedPatients || []).findIndex(p => p.id === updated.id);
        if (cachedIdx !== -1) cachedPatients[cachedIdx] = updated;

        // 5. Render the summary sheet BEFORE clearing the working set.
        //    The arrays used to be emptied first, so the report that came out
        //    of a completed session always showed "No clinical components
        //    allocated", no medications and no diagnostics -- even though all
        //    of it had just been saved successfully.
        compileMasterSummary();

        activeMaterials = [];
        activePharmacy = [];
        activeDiagnostics = [];

        if (failures.length) {
          await uiAlert(
            `Session completed, but some items could not be saved:\n\n• ${failures.join('\n• ')}`,
            { title: 'Saved With Warnings', tone: 'warn' }
          );
        } else {
          showDoctorToast('Session completed and saved successfully.');
        }
      } catch (err) {
        await uiError(err.message || "Unable to complete session");
      }
    }

    async function openAddProcedureModal() {
      const procName = await uiPrompt("Name of the procedure to add:", { title: 'Add Procedure', confirmLabel: 'Next' });
      if (!procName || procName.trim() === "") return;

      const durationInput = await uiPrompt("Approximate duration in minutes:", {
        title: 'Add Procedure', defaultValue: '30', confirmLabel: 'Add'
      });
      if (durationInput === null) return;
      const duration = parseInt(durationInput, 10) || 30;
      const cleanName = procName.trim();

      if (!ensurePresets()[cleanName]) {
        cachedPresets[cleanName] = {
          materials: [],
          pharmacy: [],
          diagnostics: [],
          notes: `Procedure performed: ${cleanName}.`,
          duration: duration
        };
      }
      
      // Check if option already exists in dropdown to avoid duplicates
      const select = document.getElementById('procedure-select');
      const existingOptions = Array.from(select.options).map(opt => opt.value);
      if (!existingOptions.includes(cleanName)) {
        const newOption = document.createElement('option');
        newOption.value = cleanName;
        newOption.text = cleanName;
        select.appendChild(newOption);
      }
      select.value = cleanName;
      applyProcedure();
    }

    // Guards against a race condition: if the user (or a fast automated
    // click) navigates to a page before the initial loadDashboardData()/
    // loadTimelineData() awaits below resolve, the unconditional
    // switchView('dashboard') that used to run afterwards would blow away
    // whatever they had just navigated to. userNavigate() marks that a real
    // navigation has happened so the initial forced switchView is skipped
    // once that's the case.
    let userHasNavigated = false;

    // Resolves once the first loadDashboardData() has completed. Views whose
    // content is entirely derived from that data wait on it before painting,
    // rather than rendering a confident-looking but empty result (My Analytics
    // showing "Total Procedures Handled: 0", an empty procedure dropdown) that
    // then silently jumps to the real numbers a moment later.
    let initialDataReady = null;

    function userNavigate(pageId) {
      userHasNavigated = true;
      const DATA_BACKED = ['dashboard', 'operations', 'doctor-analytics', 'timeline', 'leave'];
      if (initialDataReady && DATA_BACKED.includes(pageId)) {
        initialDataReady.then(() => switchView(pageId));
      } else {
        switchView(pageId);
      }
    }

    // A second, narrower consequence of the same race as above: even once
    // the forced switchView('dashboard') is correctly skipped, a view the
    // user navigated to early (e.g. Operations, My Analytics) already
    // rendered off whatever cachedPresets/cachedPatients held at that
    // instant -- which is empty until loadDashboardData() finishes. Those
    // views are never re-rendered on their own once real data arrives, so
    // the procedure dropdown / analytics table are left permanently empty.
    // Patch the two known cases in place (without blowing away any UI
    // state, e.g. an in-progress patient search) once fresh data is in.
    function refreshStaleViewData() {
      const procedureSelect = document.getElementById('procedure-select');
      if (procedureSelect) {
        const existingOptions = new Set(Array.from(procedureSelect.options).map(opt => opt.value));
        Object.keys(ensurePresets()).forEach(key => {
          if (!existingOptions.has(key)) {
            const newOption = document.createElement('option');
            newOption.value = key;
            newOption.text = key;
            procedureSelect.appendChild(newOption);
          }
        });
      }
      if (document.getElementById('docAnalyticsTableBody')) {
        // Respect a filter the doctor has already typed. Calling
        // processAndRenderDoctorAnalytics() unconditionally repaints the table
        // with the UNFILTERED row set, so a late-arriving startup refresh
        // silently threw away the search they were in the middle of.
        const query = document.getElementById('docAnalyticsSearch')?.value || '';
        if (query.trim()) filterDoctorAnalytics();
        else processAndRenderDoctorAnalytics();
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const navContainer = document.getElementById('nav-container');
      navContainer.innerHTML = PAGES.map(p => `
        <button class="nav-item" data-page="${p.id}" onclick="userNavigate('${p.id}')">${p.label}</button>
      `).join('');

      initialDataReady = loadDashboardData();
      await initialDataReady;
      refreshStaleViewData();
      await loadTimelineData();
      if (!userHasNavigated) {
        switchView('dashboard');
      }
    });
  </script>
