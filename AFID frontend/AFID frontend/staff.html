<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFID Dental Staff Portal</title>
  <style>
    /* ---------------- DESIGN SYSTEM & CONSTANTS ---------------- */
    :root {
      --green-dark: #053c2a;
      --green-med: #0f6244;
      --green-accent: #10b981;
      --green-soft: #f0fdf4;
      --red: #991b1b;
      --red-soft: #fee2e2;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --bg: #f3f7f5;
      --border: #cbd5e1;
      --text-dark: #1f2937;
      --text-muted: #4b5563;
      --card-bg: #ffffff;
      --mint-container: #e6f0eb;

      /* Premium Depth & Hover Transitions */
      --shadow-sm: 0 2px 5px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 8px 20px rgba(15, 98, 68, 0.12);
      --shadow-lg: 0 12px 28px rgba(3, 37, 26, 0.18);
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text-dark);
      height: 100vh;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      overflow-x: hidden;
    }

    /* ---------------- MAIN STRUCTURAL LAYOUT ---------------- */
    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* ---------------- SIDEBAR ---------------- */
    .sidebar {
      width: 270px;
      flex-shrink: 0;
      background: #03251a;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 4px 0 24px rgba(3, 37, 26, 0.15);
      z-index: 10;
    }

    .sidebar-header {
      margin-bottom: 24px;
      padding-left: 12px;
    }
    .sidebar-header .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .sidebar-header .sub {
      font-size: 12px;
      color: #8fa89b;
      margin-top: 4px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .sidebar-menu-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-left: 12px;
    }

    .nav-menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: #b5c7be;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition-smooth);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      transform: translateY(-2px) translateX(4px);
    }
    .nav-btn:active {
      transform: translateY(1px) translateX(2px);
    }
    .nav-btn.active {
      background: var(--green-dark);
      color: #fff;
      border-left: 4px solid var(--green-accent);
      font-weight: 600;
      box-shadow: inset 2px 2px 8px rgba(0, 0, 0, 0.2);
    }

    .sidebar-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 20px;
      padding-left: 12px;
    }
    .logged-user-label { font-size: 11px; color: #6b8f7d; font-weight: 600; text-transform: uppercase; }
    .logged-user-name { font-size: 14px; font-weight: 700; margin-top: 2px; color: #ffffff; }
    .logged-user-role { font-size: 12px; color: #6b8f7d; margin-bottom: 12px; }

    .logout-btn {
      width: 100%;
      background-color: var(--red);
      color: white;
      border: none;
      padding: 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: var(--transition-smooth);
      box-shadow: var(--shadow-sm);
    }
    .logout-btn:hover {
      background-color: #7f1d1d;
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    /* ---------------- MAIN VIEWPORT & HEADER ---------------- */
    .main-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .top-utility-bar {
      height: 60px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .search-wrapper { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 14px; }
    .search-input { border: none; outline: none; width: 280px; color: var(--text-dark); font-size: 14px; background: transparent; }
    .meta-status-group { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #4b5563; font-weight: 600; }
    .live-indicator { background-color: var(--green-dark); color: #ffffff; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.5px; }

    /* Workspace */
    .workspace {
      flex: 1;
      padding: 20px 32px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
      overflow-y: auto;
    }

    .header-group {
      border-bottom: 2px dashed var(--border);
      padding-bottom: 8px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    .header-group h1 { font-size: 24px; font-weight: 800; color: var(--green-dark); letter-spacing: -0.5px; }
    .header-group p { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }

    .grid-split {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 20px;
      flex: 1;
      min-height: 0;
    }
    .grid-split > * { min-width: 0; }

    .panel {
      background: var(--mint-container);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      transition: var(--transition-smooth);
    }

    .panel:hover {
      box-shadow: var(--shadow-md);
    }

    .panel-header {
      font-size: 12px;
      font-weight: 800;
      color: var(--green-dark);
      text-transform: uppercase;
      letter-spacing: 0.75px;
      margin-bottom: 10px;
      border-bottom: 2px solid rgba(15, 98, 68, 0.15);
      padding-bottom: 6px;
      flex-shrink: 0;
    }

    .panel-body {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: var(--shadow-sm);
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    /* COMPACT FORM LAYOUT STYLES */
    .form-grid-compact {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
    }

    .form-row { margin-bottom: 0px; }
    .form-row label { display: block; font-size: 10.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12.5px;
      color: var(--text-dark);
      background-color: #ffffff;
      transition: var(--transition-smooth);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--green-med);
      box-shadow: 0 0 0 3px rgba(15, 98, 68, 0.15);
      background-color: #fbfdfc;
    }

    /* Tables */
    .table-container {
      width: 100%;
      height: 100%;
      overflow: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left;
      background: var(--green-dark);
      padding: 12px 14px;
      font-weight: 600;
      color: #fff;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: sticky;
      top: 0;
      z-index: 5;
      white-space: nowrap;
    }
    tbody td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; color: #374151; transition: var(--transition-smooth); }

    .table-wide { width: max-content; min-width: 100%; }
    .table-wide th, .table-wide td { white-space: nowrap; }
    .table-wide td.cell-wrap { white-space: normal; min-width: 190px; max-width: 260px; }
    
    .table-wide th:first-child, .table-wide td:first-child {
      position: sticky;
      left: 0;
      background: #fff;
      z-index: 4;
    }
    .table-wide th:last-child, .table-wide td:last-child {
      position: sticky;
      right: 0;
      background: #fff;
      z-index: 4;
      box-shadow: -6px 0 8px -6px rgba(3, 37, 26, 0.18);
    }
    .table-wide thead th:first-child,
    .table-wide thead th:last-child { background: var(--green-dark); z-index: 6; }
    .table-wide tbody tr:nth-child(even) td:first-child,
    .table-wide tbody tr:nth-child(even) td:last-child { background-color: #fcfdfd; }
    .table-wide tbody tr:hover td:first-child,
    .table-wide tbody tr:hover td:last-child { background-color: #f1f7f4; }
    .table-wide td:last-child .action-link { margin-bottom: 2px; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:nth-child(even) td { background-color: #fcfdfd; }
    tbody tr:hover td { background-color: #f1f7f4 !important; }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .badge-active { background-color: var(--green-soft); color: var(--green-dark); }
    .badge-waiting { background-color: var(--amber-soft); color: var(--amber); }
    .badge-completed { background-color: #f3f4f6; color: #4b5563; }
    .badge-success { background-color: var(--green-soft); color: var(--green-dark); }
    .badge-warning { background-color: var(--amber-soft); color: var(--amber); }
    .badge-info    { background-color: #e0f2fe; color: #0369a1; }

    .btn {
      background-color: var(--green-dark);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      transition: var(--transition-smooth);
      box-shadow: var(--shadow-sm);
    }
    .btn:hover { background-color: var(--green-med); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-sm { padding: 7px 12px; font-size: 11px; letter-spacing: 0.3px; }

    .btn-primary {
      background-color: var(--green-dark);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: var(--transition-smooth);
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover {
      background-color: var(--green-med);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border);
      color: #4b5563;
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: var(--transition-smooth);
    }
    .btn-secondary:hover { background-color: #f9fafb; transform: translateY(-2px); }

    .action-link {
      background-color: var(--green-dark);
      color: #ffffff;
      border: none;
      padding: 5px 11px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .action-link:hover {
      background-color: var(--green-accent);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* --- MODAL STYLES --- */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
    }

    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background-color: var(--green-dark);
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: translateY(15px);
      transition: var(--transition-smooth);
      pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Patient Timeline Styles */
    .check-item { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
    .check-circle { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--green-soft); color: var(--green-med); flex-shrink: 0; }
    .check-circle.pending { background: #f3f4f6; color: #6b7280; }
    .check-circle.active { background: #fef9c3; color: #a16207; }
    .check-circle.completed { background: #dcfce7; color: #166534; }
    .check-text { flex: 1; }
    .check-status-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; }
    .cs-pending { background: #f3f4f6; color: #374151; }
    .cs-active { background: #fef9c3; color: #92400e; }
    .cs-completed { background: #dcfce7; color: #166534; }
    .container-card { background: white; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 24px; overflow: hidden; }
    .container-title { background: var(--green-soft); padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 600; color: var(--green-dark); }
    
    /* Patient Timeline Search Styles */
    .timeline-search-container { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
    .timeline-search-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
    .timeline-search-row select { flex: 0 0 160px; }
    .timeline-search-row input[type="text"] { flex: 1; }
    .timeline-search-row .btn-holder { flex: 0 0 auto; }
    .timeline-results-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .timeline-results-table thead th { background: var(--green-dark); color: #fff; padding: 12px 14px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; }
    .timeline-results-table tbody td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; color: #374151; }
    .timeline-results-table tbody tr:hover td { background-color: #f1f7f4 !important; }
    .timeline-detail-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-top: 20px; box-shadow: var(--shadow-sm); }
    .timeline-detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
    .timeline-detail-title { font-size: 18px; font-weight: 800; color: var(--green-dark); }
    .timeline-detail-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .timeline-badge { background: var(--green-soft); color: var(--green-dark); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 6px; }
    .timeline-steps-list { display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>

<div class="app-container">

  <script src="api.js"></script>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-header">
        <div class="brand">AFID</div>
        <div class="sub">Dental Portal</div>
      </div>

      <div class="sidebar-menu-label">Navigation</div>
      <nav class="nav-menu" id="nav-container"></nav>
    </div>

    <div class="sidebar-footer">
      <div class="logged-user-label">Logged In:</div>
      <div class="logged-user-name" id="sidebar-user-name">—</div>
      <div class="logged-user-role" id="sidebar-user-role">Role: —</div>
      <button class="logout-btn" onclick="logout()">← Logout Portal</button>
    </div>
  </aside>

  <main class="main-viewport">
    <div class="top-utility-bar">
      <div class="search-wrapper">
        <span>🔍</span>
        <input type="text" id="global-search" class="search-input" value=""
               placeholder="Filter patients by MR, file no., name or doctor..."
               oninput="applyGlobalSearch(this.value)" />
      </div>
      <div class="meta-status-group">
        <span id="live-clock">—</span>
        <span class="live-indicator">+ LIVE</span>
      </div>
    </div>

    <div class="workspace" id="main-root"></div>
  </main>
</div>

<!-- Dynamic Modal Container -->
<div id="modal-root"></div>

<script>
  // Safe Fallback for API
  if (typeof window.api === 'undefined') {
    window.api = {
      get: async () => null,
      post: async () => null,
      patch: async () => null
    };
  }

  const PAGES = [
    { id: 'dashboard', label: 'Reception Dashboard' },
    { id: 'patient_reg', label: 'Patient Registration' },
    { id: 'patient_mgmt', label: 'Patient Management' },
    { id: 'patient_timeline', label: 'Patient Timeline' },
    { id: 'doctor_mgmt', label: 'Doctor Management' }
  ];

  /* ---------------- MASTER DATA MODEL ---------------- */
  let patientLogs = [];
  let doctorAllocations = [];
  let doctorDirectory = [];
  let cachedTimelineMRs = [];
  let cachedSelectedTimelineMR = null;
  let cachedTimelineSteps = {};

  function allocationRoomFor(doctorName) {
    const match = doctorAllocations.find(a => a.name === doctorName);
    return match ? match.room : '';
  }

  const PROCEDURE_CATEGORIES = [
    'Consultation',
    'ORAL EXAM',
    'Follow-up Treatment',
    'U/L Bracketing',
    'Bonding of brackets',
    'Fixed retainer',
    'De bonding',
    'Fixed adjustment (Wire/Bends/IPR/Traction/Implant)',
    'Loose band / Button / Bracket / Tubes',
    'Molar bands / VFR',
    'Impression / O/E / Separator / Removable adj',
    'Treatment planning / File analysis / Tracing',
    'Space maintainer / Photography / Digital Scan',
    'Nance LLA / Hyrax / Quad Helix / TPA / Pendulum',
    'Fixed functional appliance Adj / EOT / Face mask',
    'NAM (First time prep + First time app)',
    'Cast Surgery / Prediction / VTO / Morphing',
    'Root Canal Treatment',
    'Surgical exposure of impacted tooth',
  ];

  function procedureCategoryOptions(selected) {
    return PROCEDURE_CATEGORIES
      .map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${c}</option>`)
      .join('');
  }

  function normalizePatient(p) {
    const status = (p.status || 'WAITING').toString().toUpperCase();
    const checkIn = p.check_in_time ? new Date(p.check_in_time) : null;
    const checkOut = p.check_out_time ? new Date(p.check_out_time) : null;
    const timeInStr = checkIn ? checkIn.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
    const timeOutStr = checkOut ? checkOut.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
    const duration = (checkIn && checkOut) ? `${Math.max(0, Math.round((checkOut - checkIn) / 60000))} min` : '—';
    const roomNum = (p.room || '').replace(/Room\s*/i, '').trim() || '—';
    return {
      id: p.id,
      mr: p.mr_number,
      file: p.file_number,
      name: p.full_name,
      cnic: p.cnic || '—',
      location: roomNum,
      rotation: p.procedure_category || '—',
      assignedDoctor: p.assigned_doctor || '—',
      time: p.registered_at ? new Date(p.registered_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '09:00 AM',
      apptDate: p.registered_at ? new Date(p.registered_at).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
      apptDateShort: (p.registered_at ? new Date(p.registered_at) : new Date())
        .toLocaleDateString(undefined, { day: '2-digit', month: 'short' }),
      registeredAt: p.registered_at || null,
      timeIn: timeInStr,
      timeOut: timeOutStr,
      duration,
      status,
      badge: status === 'ACTIVE' ? 'badge-active' : status === 'COMPLETED' ? 'badge-completed' : 'badge-waiting'
    };
  }

  function normalizeAllocation(a) {
    return {
      id: a.id,
      name: a.doctor_name || a.name,
      room: a.room || a.room_name,
      department: a.department || 'Oral Exam',
      chair: a.chair || 'Chair 1'
    };
  }

  async function loadStaffData() {
    try {
      const [patients, allocations, doctors] = await Promise.all([
        api.get('/patients/').catch(() => []),
        api.get('/allocations').catch(() => []),
        api.get('/doctors').catch(() => [])
      ]);

      patientLogs = (patients || []).map(normalizePatient);
      doctorAllocations = (allocations || []).map(normalizeAllocation);
      doctorDirectory = (doctors || [])
        .filter(d => d && d.full_name)
        .sort((a, b) => a.full_name.localeCompare(b.full_name));
    } catch (e) {
      console.warn('Failed to load staff portal data:', e);
      patientLogs = [];
      doctorAllocations = [];
      doctorDirectory = [];
    }
  }

  async function timelineSearch() {
    try {
      const patients = await api.get('/patients/');
      if (patients && patients.length) {
        patientLogs = patients.map(normalizePatient);
      }
    } catch (e) {
      console.warn('Failed to refresh patient data for timeline search:', e);
    }

    const filterType = document.getElementById('timeline-filter-type')?.value || 'mr';
    const query = document.getElementById('timeline-search-input')?.value.trim().toLowerCase() || '';
    const tbody = document.getElementById('timeline-results-body');
    const detailArea = document.getElementById('timeline-detail-area');
    if (!tbody) return;

    if (!query) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#6b7280;">Enter a search term.</td></tr>';
      if (detailArea) detailArea.style.display = 'none';
      return;
    }

    const fieldMap = { mr: 'mr', file: 'file', name: 'name', mr_number: 'mr', file_number: 'file' };
    const field = fieldMap[filterType] || 'mr';
    let results = (patientLogs || []).filter(p => (p[field] || '').toString().toLowerCase().includes(query));

    if (!results.length && filterType !== 'mr' && filterType !== 'mr_number') {
      results = (patientLogs || []).filter(p => (p.mr || '').toLowerCase().includes(query));
    }

    const statusBadge = (s) => {
      const st = (s || '').toString().toUpperCase();
      if (st === 'ACTIVE') return '<span class="badge badge-success">ACTIVE</span>';
      if (st === 'COMPLETED') return '<span class="badge badge-info">COMPLETED</span>';
      return '<span class="badge badge-warning">WAITING</span>';
    };

    tbody.innerHTML = results.length ? results.map(p => `
      <tr style="cursor:pointer;" onclick="selectTimelinePatient('${p.mr}')">
        <td><strong>${p.mr}</strong></td>
        <td>${p.file || '—'}</td>
        <td>${p.name}</td>
        <td>${statusBadge(p.status)}</td>
        <td><button class="btn btn-sm" onclick="event.stopPropagation(); selectTimelinePatient('${p.mr}')" style="height:38px;">View Timeline</button></td>
      </tr>
    `).join('') : '<tr><td colspan="5" style="text-align:center; color:#6b7280;">No patients found.</td></tr>';
  }

  async function selectTimelinePatient(mr) {
    const detailArea = document.getElementById('timeline-detail-area');
    const titleEl = document.getElementById('timeline-patient-title');
    const badgeEl = document.getElementById('timeline-total-badge');
    const stepsList = document.getElementById('timeline-steps-list');
    const record = (patientLogs || []).find(p => p.mr === mr) || null;
    if (detailArea) detailArea.style.display = 'block';
    if (titleEl) titleEl.innerText = record ? `${record.name} (${mr})` : mr;

    try {
      const steps = await api.get(`/hod/timeline/${encodeURIComponent(mr)}`);
      cachedTimelineSteps[mr] = steps || [];
    } catch (e) {
      cachedTimelineSteps[mr] = [];
    }

    const allSteps = cachedTimelineSteps[mr] || [];
    const completedProcedures = allSteps.filter(s => s.status === 'Completed');
    const pending = allSteps.filter(s => (s.status || '').toLowerCase() === 'pending');
    const inProgress = allSteps.filter(s => (s.status || '').toLowerCase() === 'in progress');
    if (badgeEl) badgeEl.innerText = `Total Performed: ${completedProcedures.length}`;

    const buildList = (items, emptyLabel, badgeClass, icon) => items.length ? items.map(s => `
      <div class="check-item">
        <div class="check-circle ${badgeClass}">${icon || ''}</div>
        <div class="check-text">
          <div style="font-size:15px; font-weight:700; color:#1f2937;">${s.name || s.step_name || '—'}</div>
        </div>
        <div class="check-status-badge cs-${badgeClass}">${s.status || '—'}</div>
      </div>
    `).join('') : `<div style="text-align:center; padding:16px; color:#6b7280; font-size:13px;">${emptyLabel}</div>`;

    if (stepsList) stepsList.innerHTML = `
      ${buildList(pending, 'No pending steps.', 'pending', '○')}
      ${buildList(inProgress, 'No in-progress steps.', 'active', '◐')}
      ${buildList(completedProcedures, 'No completed procedures yet.', 'completed', '✓')}
    `;
  }

            <div class="form-row" style="margin-bottom:10px;">
              <label>Appointment Time</label>
              <input type="time" id="appt-time" value="10:30" required />
            </div>

            <div style="display:flex; gap:8px; margin-top:20px;">
              <button type="submit" class="btn-primary" style="flex:2;">Confirm & Queue Patient</button>
              <button type="button" class="btn-secondary" style="flex:1;" onclick="closeModal()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    `;
    document.getElementById('modal-root').innerHTML = modalHTML;
  }

  function closeModal() {
    document.getElementById('modal-root').innerHTML = '';
  }

  async function saveNextAppointment(e, mr, name, doctor) {
    e.preventDefault();
    const date = document.getElementById('appt-date').value;
    const rawTime = document.getElementById('appt-time').value;
    const procedure = document.getElementById('appt-procedure').value;

    const [h, m] = rawTime.split(':');
    const formattedTime = new Date(0, 0, 0, h, m).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const patientIndex = patientLogs.findIndex(p => p.mr === mr);
    if (patientIndex !== -1) {
      const patient = patientLogs[patientIndex];
      try {
        const updated = await api.patch(`/patients/${patient.id}/status`, { status: 'WAITING' });
        patientLogs[patientIndex] = normalizePatient(updated);
        patientLogs[patientIndex].time = formattedTime;
        patientLogs[patientIndex].apptDate = date;
        patientLogs[patientIndex].rotation = procedure;
      } catch (error) {
        showToast(error.message || 'Unable to queue next appointment');
        return;
      }
    } else {
      patientLogs.unshift({
        id: Date.now(),
        mr: mr,
        file: 'F-' + Math.floor(10000 + Math.random() * 90000),
        name: name,
        cnic: '35202-0000000-0',
        location: 'Room 12',
        rotation: procedure,
        assignedDoctor: doctor,
        time: formattedTime,
        apptDate: date,
        timeIn: '—',
        timeOut: '—',
        status: 'WAITING',
        badge: 'badge-waiting'
      });
    }

    closeModal();
    switchView('patient_mgmt');
    showToast(`Next appointment booked for ${date} (${formattedTime}) under ${doctor}!`);
  }

  function showToast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerText = msg;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2400);
  }

  /* ==================== ACTIONS ==================== */

  async function addPatient(e) {
    e.preventDefault();
    const val = (id) => (document.getElementById(id)?.value || '').trim();

    const mr = val('p-mr');
    const file = val('p-file');
    const name = val('p-name');
    const cnic = val('p-cnic');
    const gender = val('p-gender');
    const bloodGroup = val('p-blood');
    const serviceProfile = val('p-service-profile');
    const allergies = val('p-allergies');
    const room = val('p-room');
    const rotation = val('p-procedure');
    const doctor = val('p-doctor');

    if (!doctor) {
      await uiError('No dentist selected. Register a doctor account in the main portal first.');
      return;
    }

    try {
      const created = await api.post('/patients/', {
        mr_number: mr,
        file_number: file,
        full_name: name,
        rank: name,
        cnic,
        gender,
        blood_group: bloodGroup,
        service_profile: serviceProfile,
        allergies: allergies || null,
        room,
        assigned_doctor: doctor,
        procedure_category: rotation
      });

      patientLogs.unshift(normalizePatient(created));
      switchView('patient_mgmt');
      showToast(`Registered & Queued ${name} under ${doctor}`);
    } catch (error) {
      await uiError(error.message || 'Unable to register patient');
    }
  }

  async function startProcedure(index) {
    const patient = patientLogs[index];
    if (!patient) return;

    try {
      const updated = await api.patch(`/patients/${patient.id}/status`, { status: 'ACTIVE' });
      patientLogs[index] = normalizePatient(updated);
      switchView('patient_mgmt');
      showToast(`Time In recorded`);
    } catch (error) {
      showToast(error.message || 'Unable to start procedure');
    }
  }

  async function completeProcedure(index) {
    const patient = patientLogs[index];
    if (!patient) return;

    try {
      const updated = await api.patch(`/patients/${patient.id}/status`, { status: 'COMPLETED' });
      patientLogs[index] = normalizePatient(updated);
      switchView('patient_mgmt');
      showToast(`Time Out recorded`);
    } catch (error) {
      showToast(error.message || 'Unable to complete procedure');
    }
  }

  async function addDoctorAllocation(e) {
    e.preventDefault();
    const name = document.getElementById('d-name').value;
    const room = document.getElementById('d-room').value;

    if (!name) {
      await uiError('Select a doctor to allocate.');
      return;
    }

    try {
      await api.post('/allocations', {
        doctor_name: name,
        room,
        department: 'Orthodontics',
        chair: 'Chair 1'
      });
      await refreshDoctorData();
      switchView('doctor_mgmt');
      showToast(`${name} allocated to ${room}`);
    } catch (error) {
      await uiError(error.message || 'Unable to create allocation');
    }
  }

  async function releaseAllocation(allocId, doctorName, room) {
    const ok = await uiConfirm(
      `Release ${room} from ${doctorName}? The room becomes available for another doctor.`,
      { title: 'Release Room', confirmLabel: 'Release' }
    );
    if (!ok) return;

    try {
      await api.delete(`/allocations/${allocId}`);
      await refreshDoctorData();
      switchView('doctor_mgmt');
      showToast(`${room} released`);
    } catch (error) {
      await uiError(error.message || 'Unable to release allocation');
    }
  }

  async function refreshDoctorData() {
    try {
      const [allocations, doctors] = await Promise.all([
        api.get('/allocations').catch(() => []),
        api.get('/doctors').catch(() => [])
      ]);
      doctorAllocations = (allocations || []).map(normalizeAllocation);
      doctorDirectory = (doctors || [])
        .filter(d => d && d.full_name)
        .sort((a, b) => a.full_name.localeCompare(b.full_name));
    } catch (e) {
      console.warn('Failed to refresh doctor data:', e);
    }
  }

  /* ==================== CONTROLLER ==================== */

  function switchView(pageId) {
    currentPageId = pageId;
    const container = document.getElementById('main-root');
    if (pageId === 'dashboard') container.innerHTML = renderDashboard();
    else if (pageId === 'patient_reg') container.innerHTML = renderPatientRegistration();
    else if (pageId === 'patient_mgmt') container.innerHTML = renderPatientManagement();
    else if (pageId === 'patient_timeline') container.innerHTML = renderPatientTimeline();
    else if (pageId === 'doctor_mgmt') container.innerHTML = renderDoctorManagement();

    if (pageId === 'dashboard') applyLoggedInIdentity();

    if ((pageId === 'doctor_mgmt' || pageId === 'patient_reg' || pageId === 'dashboard')
        && refreshedForPage !== pageId) {
      refreshedForPage = pageId;
      refreshDoctorData().finally(() => {
        const stillHere = document.querySelector('.nav-btn.active')?.dataset.page === pageId;
        const typed = ['p-mr', 'p-file', 'p-name', 'p-cnic']
          .some(id => (document.getElementById(id)?.value || '').trim() !== '');
        if (stillHere && !typed) switchView(pageId);
      });
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.page === pageId);
    });
  }

  let userHasNavigated = false;
  function userNavigate(pageId) {
    userHasNavigated = true;
    refreshedForPage = null;
    switchView(pageId);
  }

  let globalSearchTerm = '';
  let currentPageId = 'patient_mgmt';
  let refreshedForPage = null;

  function applyGlobalSearch(value) {
    globalSearchTerm = value || '';
    if (currentPageId === 'patient_mgmt') {
      document.getElementById('main-root').innerHTML = renderPatientManagement();
    }
  }

  function startLiveClock() {
    const el = document.getElementById('live-clock');
    if (!el) return;
    const tick = () => {
      el.innerText = new Date().toLocaleString(undefined, {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    };
    tick();
    setInterval(tick, 30000);
  }

  function applyLoggedInIdentity() {
    let user = null;
    try { user = JSON.parse(localStorage.getItem('afid_user')); } catch (e) { user = null; }
    const nameEl = document.getElementById('sidebar-user-name');
    const roleEl = document.getElementById('sidebar-user-role');
    if (nameEl) nameEl.innerText = user?.full_name || 'Unknown User';
    if (roleEl) {
      const role = (user?.role || 'staff').toString();
      roleEl.innerText = `Role: ${role.charAt(0).toUpperCase()}${role.slice(1)}`;
    }
    const operatorEl = document.getElementById('staff-operator-name');
    if (operatorEl) operatorEl.textContent = user?.full_name || '—';
  }

  function initApp() {
    const navContainer = document.getElementById('nav-container');
    navContainer.innerHTML = PAGES.map(p => `
      <button class="nav-btn" data-page="${p.id}" onclick="userNavigate('${p.id}')">
        <span>${p.label}</span>
      </button>
    `).join('');
  }

  window.onload = async () => {
    initApp();
    applyLoggedInIdentity();
    startLiveClock();
    await loadStaffData();
    await loadTimelineData();
    if (!userHasNavigated) {
      switchView('patient_mgmt');
    }
  };
</script>

</body>
</html>
